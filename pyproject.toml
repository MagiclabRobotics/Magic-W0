[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-w0"
version = "0.1.0"
description = "MagicW0 training, inference and RoboDojo evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*.txt"]
dependencies = [
  "numpy==1.26.4", "Pillow==11.3.0", "PyYAML==6.0.3",
  "packaging>=24", "transformers==5.14.1",
  "opencv-python-headless==4.11.0.86",
]

[project.optional-dependencies]
train = ["torch>=2.5.1,<3", "torchvision>=0.20,<1", "scipy>=1.12,<2", "pyarrow>=17,<25", "pandas>=2.2,<3", "av>=13,<17", "einops>=0.8,<1", "tqdm>=4.66,<5"]
logging = ["wandb>=0.19,<1"]
teachers = ["addict>=2.4,<3", "omegaconf==2.3.0", "termcolor>=2,<4", "imageio>=2.37,<3", "evo==1.34.1"]
eval = ["websockets==15.0.1", "msgpack>=1.1,<2", "msgpack-numpy==0.4.8", "pydantic>=2,<3"]
test = ["pytest>=8,<10", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff.lint]
select = ["F"]

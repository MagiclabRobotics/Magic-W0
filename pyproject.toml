[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-w0"
version = "0.1.0"
description = "Magic-W0 inference runtime and RoboDojo evaluation adapter"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy==1.26.4", "Pillow==11.3.0", "PyYAML==6.0.3",
  "packaging>=24", "transformers==5.14.1",
  "opencv-python-headless==4.11.0.86",
]

[project.optional-dependencies]
eval = ["websockets==15.0.1", "msgpack>=1.1,<2", "msgpack-numpy==0.4.8", "pydantic>=2,<3"]
test = ["pytest>=8,<10", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff.lint]
select = ["F"]

name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU runtime
        run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and development dependencies
        run: python -m pip install -c constraints/train.txt -e '.[train,teachers,eval,test]'
      - run: python -m pip check
      - run: python -m ruff check src eval scripts tests
      - run: python -m pytest -q
